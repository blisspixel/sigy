[package]
name = "sigy-judge-runner"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"
authors = ["Nick Seal <32712898+blisspixel@users.noreply.github.com>"]

[workspace]

[dependencies]
scorer-probe = { path = "../../language-scorer" }
processkit = { version = "=3.3.4", default-features = false, features = ["limits"] }
tokio = { version = "=1.53.1", features = ["io-util", "macros", "rt-multi-thread", "process", "time", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
incremental = false
