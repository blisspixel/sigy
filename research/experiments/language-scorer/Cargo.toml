[package]
name = "scorer-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"

[workspace]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
unicode-normalization = "=0.1.25"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
incremental = false
