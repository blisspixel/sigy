[package]
name = "sigy-hosted-eval"
version = "0.0.0"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "Apache-2.0"
authors = ["Nick Seal <32712898+blisspixel@users.noreply.github.com>"]

[workspace]

[dependencies]
scorer-probe = { path = "../language-scorer" }
sigy-core = { path = "../../../crates/sigy-core" }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["raw_value"] }
sha2 = "=0.11.0"
tokio = { version = "=1.53.1", default-features = false, features = ["rt", "macros", "time", "net", "io-util"] }
webpki-root-certs = "=1.0.9"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.dev]
debug = 0
incremental = false
