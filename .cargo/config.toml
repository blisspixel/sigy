[build]
# Keep local development usable on small hosts and during background capture.
jobs = 2

[alias]
verify = "run --locked --package sigy-xtask -- verify"
verify-media = "run --locked --package sigy-xtask -- verify-media"
verify-coverage = "run --locked --package sigy-xtask -- verify-coverage"
visual-qa = "test --locked --package sigy visual_qa_gallery -- --ignored --nocapture"
