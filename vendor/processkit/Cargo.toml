    "os",
    "os::unix-apis",
    "os::windows-apis",
    "concurrency",
]
license = "MIT"
repository = "https://github.com/ZelAnton/ProcessKit-rs"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["process-control"]
json = [
    "dep:serde",
    "dep:serde_json",
]
limits = ["stats"]
metrics = ["dep:metrics"]
mock = ["dep:mockall"]
process-control = []
pty = ["windows-sys/Win32_System_Pipes"]
record = [
    "dep:serde",
    "dep:serde_json",
]
report-serde = ["dep:serde"]
stats = ["windows-sys/Win32_System_ProcessStatus"]
tracing = ["dep:tracing"]

