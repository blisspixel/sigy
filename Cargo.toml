[workspace]
members = ["crates/sigy-core", "crates/sigy-service", "crates/sigy"]
resolver = "3"
exclude = ["vendor/libsqlite3-sys"]

[patch.crates-io]
libsqlite3-sys = { path = "vendor/libsqlite3-sys" }

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["Nick Seal <32712898+blisspixel@users.noreply.github.com>"]
repository = "https://github.com/blisspixel/sigy"

[workspace.dependencies]
sigy-core = { path = "crates/sigy-core" }
sigy-service = { path = "crates/sigy-service" }
clap = { version = "4.6.7", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tempfile = "3.27.0"
interprocess = { version = "2.4.4", default-features = false, features = ["tokio"] }
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread", "macros", "io-util", "sync", "time", "signal", "net", "fs", "process"] }
getrandom = "0.4.3"
widestring = "1.2.1"
winsafe = { version = "0.0.29", default-features = false, features = ["kernel"] }
rustix = { version = "1.1.4", default-features = false, features = ["std", "process"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-root-certs = "1.0.9"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["system-config", "tokio"] }
sha2 = "0.11.0"
fs4 = { version = "1.1.0", default-features = false }
process-wrap = { version = "10.0.0", default-features = false, features = ["tokio1", "job-object", "kill-on-drop", "process-group", "creation-flags"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
