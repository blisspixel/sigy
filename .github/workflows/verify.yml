name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: cargo verify
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer script syntax
        shell: bash
        run: sh -n scripts/install.sh
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Cache Cargo output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install cargo-audit 0.22.2
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Verify
        run: cargo verify

  unix:
    name: Unix build and lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check installer script syntax
        run: sh -n scripts/install.sh
      - name: Install the pinned toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - name: Cache Cargo output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check every target
        run: cargo check --workspace --all-targets --locked
      - name: Deny warnings
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test platform contracts
        run: |
          cargo test --locked -p sigy-service --lib control::doctor -- --test-threads=2
          cargo test --locked -p sigy-service --lib recordings::pipe::tests -- --test-threads=2
          cargo test --locked -p sigy --bin sigy lifecycle_tests -- --test-threads=2
          cargo test --locked -p sigy --test service native_containment_preflight -- --test-threads=2
      - name: Prepare the disposable Linux user manager
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Exercise delegated Linux resource and death bounds
        if: runner.os == 'Linux'
        run: cargo test --locked -p sigy-service --test linux_native delegated_native_contracts -- --ignored --nocapture --test-threads=1
      - name: Exercise Linux playback, capture and restart
        if: runner.os == 'Linux'
        env:
          SIGY_TEST_FFMPEG: /usr/bin/ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          test -x /usr/bin/ffmpeg
          cargo test --locked -p sigy --test service direct_listen_reaches_decoder_progress_without_a_file_or_reservation -- --ignored --test-threads=1
          cargo test --locked -p sigy --test service recording_is_service_owned_verified_exportable_and_prunable -- --ignored --test-threads=1
          cargo test --locked -p sigy --test service retained_playback_seeks_without_changing_quota_or_capture -- --ignored --test-threads=1
